AWSTemplateFormatVersion: "2010-09-09"

Description: >
  GTN-2026-2 — Equipo equipo-8 — Chat de FAQ con IA.
  Stack unico con secciones por capa (red, datos, computo, alertas). Incluye la EC2
  con Docker Compose y el modelo en contenedor (Ollama), porque Bedrock no esta
  habilitado en la cuenta del laboratorio.

Metadata:
  Curso: GTN-2026-2
  Equipo: equipo-8
  Proyecto: "08"

Parameters:
  NombreEquipo:
    Type: String
    Default: equipo-8
    MinLength: 3
    MaxLength: 20
    AllowedPattern: "^[a-z0-9-]+$"
    Description: Nombre corto del equipo. Se usa en tags y nombres de recursos.

  NumeroProyecto:
    Type: String
    Default: "08"
    AllowedPattern: "^[0-9]{1,2}$"
    Description: Numero del enunciado asignado por el docente.

  Ambiente:
    Type: String
    Default: lab
    AllowedValues:
      - lab
      - prod
    Description: Ambiente de despliegue.

  TopeGastoUSD:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 100
    Description: Tope mensual de gasto del proyecto, en dolares.

  ProveedorLLM:
    Type: String
    Default: ollama
    AllowedValues:
      - ollama
      - bedrock
    Description: ollama = modelo en contenedor en la EC2 (disponible en el laboratorio); bedrock = API gestionada (requiere habilitacion).

  ModeloOllama:
    Type: String
    Default: qwen2.5:1.5b-instruct
    Description: Modelo que se descarga en el contenedor de Ollama.

  TipoInstancia:
    Type: String
    Default: t3.small
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium
    Description: t3.micro = 1 GB (no alcanza para el modelo), t3.small = 2 GB, t3.medium = 4 GB.

  ImagenId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: AMI de Amazon Linux 2023 (se resuelve desde SSM, siempre la ultima).

  InstanceProfileName:
    Type: String
    Default: LabInstanceProfile
    Description: Perfil de instancia preexistente. El laboratorio no permite crear roles IAM.

  RepoGit:
    Type: String
    Default: https://github.com/Nhigtus/Gestion-en-la-nube
    Description: Repositorio que se clona en la EC2 para levantar la app con Docker Compose.

  RamaGit:
    Type: String
    Default: main
    Description: Rama que se despliega en la EC2.

  RetencionLogsDias:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 30
    Description: Dias de retencion de los logs de CloudWatch.

Conditions:
  UsaOllama: !Equals [!Ref ProveedorLLM, ollama]

Resources:
  # ================================================================ RED
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - {Key: Name, Value: !Sub "gtn-${NombreEquipo}-vpc"}
        - {Key: Curso, Value: GTN-2026-2}
        - {Key: Equipo, Value: !Ref NombreEquipo}
        - {Key: Proyecto, Value: !Ref NumeroProyecto}
        - {Key: Ambiente, Value: !Ref Ambiente}

  SubnetPublica:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.20.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - {Key: Name, Value: !Sub "gtn-${NombreEquipo}-subnet-publica"}
        - {Key: Curso, Value: GTN-2026-2}
        - {Key: Equipo, Value: !Ref NombreEquipo}
        - {Key: Proyecto, Value: !Ref NumeroProyecto}
        - {Key: Ambiente, Value: !Ref Ambiente}

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - {Key: Name, Value: !Sub "gtn-${NombreEquipo}-igw"}
        - {Key: Curso, Value: GTN-2026-2}
        - {Key: Equipo, Value: !Ref NombreEquipo}
        - {Key: Proyecto, Value: !Ref NumeroProyecto}
        - {Key: Ambiente, Value: !Ref Ambiente}

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  TablaRutas:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - {Key: Name, Value: !Sub "gtn-${NombreEquipo}-rt"}
        - {Key: Curso, Value: GTN-2026-2}
        - {Key: Equipo, Value: !Ref NombreEquipo}
        - {Key: Proyecto, Value: !Ref NumeroProyecto}
        - {Key: Ambiente, Value: !Ref Ambiente}

  RutaInternet:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref TablaRutas
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  AsociacionRuta:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetPublica
      RouteTableId: !Ref TablaRutas

  # ============================================================ SEGURIDAD
  GrupoSeguridadWeb:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTP publico del chat. Sin SSH abierto.
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Chat web
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Salida para dnf, Docker Hub y descarga del modelo
      Tags:
        - {Key: Name, Value: !Sub "gtn-${NombreEquipo}-sg-web"}
        - {Key: Curso, Value: GTN-2026-2}
        - {Key: Equipo, Value: !Ref NombreEquipo}
        - {Key: Proyecto, Value: !Ref NumeroProyecto}
        - {Key: Ambiente, Value: !Ref Ambiente}

  # ================================================================ DATOS
  TablaFaq:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub "gtn-${NombreEquipo}-faq"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      Tags:
        - {Key: Curso, Value: GTN-2026-2}
        - {Key: Equipo, Value: !Ref NombreEquipo}
        - {Key: Proyecto, Value: !Ref NumeroProyecto}
        - {Key: Ambiente, Value: !Ref Ambiente}

  TablaConversaciones:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub "gtn-${NombreEquipo}-conversaciones"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sesion
          AttributeType: S
        - AttributeName: ts
          AttributeType: S
      KeySchema:
        - AttributeName: sesion
          KeyType: HASH
        - AttributeName: ts
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expira
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - {Key: Curso, Value: GTN-2026-2}
        - {Key: Equipo, Value: !Ref NombreEquipo}
        - {Key: Proyecto, Value: !Ref NumeroProyecto}
        - {Key: Ambiente, Value: !Ref Ambiente}

  TablaSinRespuesta:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub "gtn-${NombreEquipo}-sin-respuesta"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      Tags:
        - {Key: Curso, Value: GTN-2026-2}
        - {Key: Equipo, Value: !Ref NombreEquipo}
        - {Key: Proyecto, Value: !Ref NumeroProyecto}
        - {Key: Ambiente, Value: !Ref Ambiente}

  TablaUso:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub "gtn-${NombreEquipo}-uso"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: mes
          AttributeType: S
      KeySchema:
        - AttributeName: mes
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      Tags:
        - {Key: Curso, Value: GTN-2026-2}
        - {Key: Equipo, Value: !Ref NombreEquipo}
        - {Key: Proyecto, Value: !Ref NumeroProyecto}
        - {Key: Ambiente, Value: !Ref Ambiente}

  BucketWeb:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub "gtn-2026-2-${NombreEquipo}-${AWS::AccountId}-web"
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - {Key: Curso, Value: GTN-2026-2}
        - {Key: Equipo, Value: !Ref NombreEquipo}
        - {Key: Proyecto, Value: !Ref NumeroProyecto}
        - {Key: Ambiente, Value: !Ref Ambiente}

  # ============================================================== COMPUTO
  InstanciaApp:
    Type: AWS::EC2::Instance
    Condition: UsaOllama
    Properties:
      ImageId: !Ref ImagenId
      InstanceType: !Ref TipoInstancia
      IamInstanceProfile: !Ref InstanceProfileName
      SubnetId: !Ref SubnetPublica
      SecurityGroupIds:
        - !Ref GrupoSeguridadWeb
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            set -euxo pipefail
            exec > /var/log/gtn-bootstrap.log 2>&1

            # --- Docker + compose plugin
            dnf install -y docker git
            systemctl enable --now docker
            mkdir -p /usr/libexec/docker/cli-plugins
            curl -SL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 \
              -o /usr/libexec/docker/cli-plugins/docker-compose
            chmod +x /usr/libexec/docker/cli-plugins/docker-compose
            ln -sf /usr/libexec/docker/cli-plugins/docker-compose /usr/bin/docker-compose

            # buildx: `docker compose build` lo exige (AL2023 no lo trae)
            BUILDX=$(curl -s https://api.github.com/repos/docker/buildx/releases/latest | grep -m1 '"tag_name"' | cut -d'"' -f4)
            if [ -n "$BUILDX" ]; then
              curl -sSL "https://github.com/docker/buildx/releases/download/$BUILDX/buildx-$BUILDX.linux-amd64" \
                -o /usr/libexec/docker/cli-plugins/docker-buildx
              chmod +x /usr/libexec/docker/cli-plugins/docker-buildx
            fi

            # --- swap de 2 GB (el modelo no cabe comodo en 2 GB de RAM)
            if [ ! -f /swapfile ]; then
              dd if=/dev/zero of=/swapfile bs=1M count=2048
              chmod 600 /swapfile
              mkswap /swapfile
              swapon /swapfile
              echo '/swapfile none swap sw 0 0' >> /etc/fstab
            fi

            # --- codigo
            rm -rf /opt/gtn/src
            git clone --depth 1 --branch ${RamaGit} ${RepoGit} /opt/gtn/src

            # --- configuracion de la app
            cat > /opt/gtn/src/app/.env <<'ENVEOF'
            AWS_REGION=us-east-1
            TABLA_FAQ=gtn-${NombreEquipo}-faq
            TABLA_CONVERSACIONES=gtn-${NombreEquipo}-conversaciones
            TABLA_SIN_RESPUESTA=gtn-${NombreEquipo}-sin-respuesta
            TABLA_USO=gtn-${NombreEquipo}-uso
            PROVEEDOR_LLM=${ProveedorLLM}
            MODELO=${ModeloOllama}
            PUERTO_PUBLICO=80
            OLLAMA_URL=http://ollama:11434
            TOPE_GASTO_USD=${TopeGastoUSD}
            ENVEOF

            # --- arranque
            cd /opt/gtn/src/app
            docker compose up -d --build

            # --- descarga del modelo (persistente en el volumen)
            for i in $(seq 1 30); do
              if docker compose exec -T ollama ollama list >/dev/null 2>&1; then break; fi
              sleep 10
            done
            docker compose exec -T ollama ollama pull ${ModeloOllama} || true
            echo "GTN bootstrap terminado" >> /var/log/gtn-bootstrap.log
          - {
              NombreEquipo: !Ref NombreEquipo,
              RamaGit: !Ref RamaGit,
              RepoGit: !Ref RepoGit,
              ProveedorLLM: !Ref ProveedorLLM,
              ModeloOllama: !Ref ModeloOllama,
              TopeGastoUSD: !Ref TopeGastoUSD
            }
      Tags:
        - {Key: Name, Value: !Sub "gtn-${NombreEquipo}-app"}
        - {Key: Curso, Value: GTN-2026-2}
        - {Key: Equipo, Value: !Ref NombreEquipo}
        - {Key: Proyecto, Value: !Ref NumeroProyecto}
        - {Key: Ambiente, Value: !Ref Ambiente}

  # ============================================================== ALERTAS
  # Presupuesto de solo lectura: no crea suscripciones ni envia correos.
  # El tope se consulta en la consola de AWS Budgets y en el contador de la tabla Uso.
  PresupuestoMensual:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "gtn-${NombreEquipo}-tope"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref TopeGastoUSD
          Unit: USD

  GrupoLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/gtn/${NombreEquipo}/app"
      RetentionInDays: !Ref RetencionLogsDias
      Tags:
        - {Key: Curso, Value: GTN-2026-2}
        - {Key: Equipo, Value: !Ref NombreEquipo}
        - {Key: Proyecto, Value: !Ref NumeroProyecto}
        - {Key: Ambiente, Value: !Ref Ambiente}

Outputs:
  UrlDemo:
    Description: URL publica del chat (http)
    Condition: UsaOllama
    Value: !Sub "http://${InstanciaApp.PublicIp}/"

  IpPublica:
    Description: IP publica de la EC2 (cambia al detener/encender)
    Condition: UsaOllama
    Value: !GetAtt InstanciaApp.PublicIp

  IdInstancia:
    Description: ID de la instancia para stop/start
    Condition: UsaOllama
    Value: !Ref InstanciaApp

  TablaFaq:
    Description: Tabla con la base de preguntas y respuestas
    Value: !Ref TablaFaq
    Export:
      Name: !Sub "${AWS::StackName}-TablaFaq"

  TablaConversaciones:
    Description: Historial de conversaciones (TTL 30 dias)
    Value: !Ref TablaConversaciones
    Export:
      Name: !Sub "${AWS::StackName}-TablaConversaciones"

  TablaSinRespuesta:
    Description: Preguntas que el bot no supo responder
    Value: !Ref TablaSinRespuesta
    Export:
      Name: !Sub "${AWS::StackName}-TablaSinRespuesta"

  TablaUso:
    Description: Contador de tokens y costo del mes
    Value: !Ref TablaUso
    Export:
      Name: !Sub "${AWS::StackName}-TablaUso"

  BucketWeb:
    Description: Bucket del frontend (privado)
    Value: !Ref BucketWeb

  GrupoLogs:
    Description: Log group de la aplicacion
    Value: !Ref GrupoLogs

  ModeloConfigurado:
    Description: Modelo que usa el proveedor de LLM
    Value: !Ref ModeloOllama

  TopeGastoMensual:
    Description: Tope mensual configurado en USD
    Value: !Ref TopeGastoUSD
