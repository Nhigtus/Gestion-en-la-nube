<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asistente del programa — FAQ</title>
  <style>
    :root { color-scheme: dark; --acento: #1f6feb; --fondo: #0d1117; --panel: #161b22; --texto: #e6edf3; --tenue: #8b949e; --borde: #30363d; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--fondo); color: var(--texto);
           font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 20px; }
    main { width: min(760px, 100%); height: min(760px, 92vh); background: var(--panel); border: 1px solid var(--borde);
           border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; }
    header { padding: 14px 18px; border-bottom: 1px solid var(--borde); display: flex; align-items: center; gap: 12px; }
    header .titulo { flex: 1; }
    header h1 { margin: 0; font-size: 1rem; font-weight: 600; }
    header p { margin: 2px 0 0; color: var(--tenue); font-size: .78rem; }
    .punto { width: 8px; height: 8px; border-radius: 50%; background: #3fb950; box-shadow: 0 0 0 3px #3fb95022; }
    button.secundario { background: transparent; border: 1px solid var(--borde); color: var(--tenue); border-radius: 8px;
                        padding: 6px 10px; font: inherit; font-size: .78rem; cursor: pointer; }
    button.secundario:hover { color: var(--texto); border-color: var(--tenue); }
    #hilo { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 86%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .bot { background: #21262d; border-bottom-left-radius: 4px; align-self: flex-start; }
    .user { background: var(--acento); border-bottom-right-radius: 4px; align-self: flex-end; }
    .meta { color: var(--tenue); font-size: .72rem; margin-top: 8px; display: flex; flex-wrap: wrap; gap: 8px; }
    .fuente { border: 1px solid var(--borde); border-radius: 999px; padding: 1px 8px; }
    .error { background: #3d1d1d; border: 1px solid #f85149; }
    #escribiendo { color: var(--tenue); font-size: .8rem; padding: 0 4px; display: none; }
    form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--borde); }
    input { flex: 1; padding: 11px 13px; border-radius: 9px; border: 1px solid var(--borde); background: #0d1117;
            color: inherit; font: inherit; outline: none; }
    input:focus { border-color: var(--acento); }
    button.enviar { padding: 0 18px; border: 0; border-radius: 9px; background: var(--acento); color: #fff; font: inherit; cursor: pointer; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    footer { padding: 8px 18px; color: var(--tenue); font-size: .72rem; border-top: 1px solid var(--borde);
             display: flex; justify-content: space-between; gap: 10px; }
    .sugerencias { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 18px 10px; }
    .sugerencias button { background: #21262d; border: 1px solid var(--borde); color: var(--texto); border-radius: 999px;
                          padding: 4px 10px; font: inherit; font-size: .75rem; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <header>
      <span class="punto" title="En línea"></span>
      <div class="titulo">
        <h1>Asistente del programa</h1>
        <p>Responde 24/7 con la base de preguntas frecuentes</p>
      </div>
      <button class="secundario" id="nueva" type="button">Nueva conversación</button>
    </header>

    <div id="hilo" role="log" aria-live="polite"></div>
    <div id="escribiendo">El asistente está pensando…</div>

    <div class="sugerencias" id="sugerencias">
      <button type="button">¿Cuándo abre la inscripción?</button>
      <button type="button">¿Cuánto cuesta el semestre?</button>
      <button type="button">¿Hay becas?</button>
      <button type="button">¿Cómo hago la homologación?</button>
    </div>

    <form id="form">
      <input id="pregunta" placeholder="Escribe tu pregunta…" autocomplete="off" maxlength="500" required>
      <button class="enviar" type="submit" id="enviar">Enviar</button>
    </form>

    <footer>
      <span id="uso">Consultas este mes: —</span>
      <span>Prototipo académico · GTN-2026-2</span>
    </footer>
  </main>

  <script>
    const hilo = document.getElementById("hilo");
    const form = document.getElementById("form");
    const input = document.getElementById("pregunta");
    const enviar = document.getElementById("enviar");
    const escribiendo = document.getElementById("escribiendo");
    const uso = document.getElementById("uso");

    const clave = "gtn-sesion";
    let sesion = localStorage.getItem(clave);
    if (!sesion) {
      sesion = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()));
      localStorage.setItem(clave, sesion);
    }

    function burbuja(texto, clase) {
      const div = document.createElement("div");
      div.className = "msg " + clase;
      div.textContent = texto;
      hilo.appendChild(div);
      hilo.scrollTop = hilo.scrollHeight;
      return div;
    }

    function conMeta(nodo, respuesta) {
      const meta = document.createElement("div");
      meta.className = "meta";
      const partes = [];
      if (respuesta.latencia_ms !== undefined) partes.push(`${(respuesta.latencia_ms / 1000).toFixed(1)} s`);
      if (respuesta.tokens && respuesta.proveedor !== "ninguno") {
        partes.push(`${respuesta.tokens.entrada + respuesta.tokens.salida} tokens`);
      }
      partes.push(respuesta.costo_usd ? `${respuesta.costo_usd.toFixed(5)} USD` : "modelo local");
      meta.textContent = partes.join(" · ");
      if (respuesta.fuentes && respuesta.fuentes.length) {
        const detalle = document.createElement("span");
        detalle.className = "fuente";
        detalle.textContent = `basado en ${respuesta.fuentes.length} FAQ`;
        detalle.title = respuesta.fuentes.map(f => f.pregunta).join("\n");
        meta.appendChild(document.createTextNode(" "));
        meta.appendChild(detalle);
      }
      nodo.appendChild(meta);
    }

    async function cargarHistorial() {
      try {
        const r = await fetch(`/api/historial/${encodeURIComponent(sesion)}`);
        const datos = await r.json();
        for (const m of datos.mensajes) {
          burbuja(m.texto, m.rol === "user" ? "user" : "bot");
        }
      } catch (e) { /* sesión nueva */ }
    }

    async function actualizarUso() {
      try {
        const r = await fetch("/api/uso");
        const u = await r.json();
        uso.textContent = `Consultas este mes: ${u.consultas} · costo ${u.costo_usd.toFixed(4)} USD de ${u.tope_usd} USD`;
      } catch (e) { uso.textContent = "Consultas este mes: —"; }
    }

    form.addEventListener("submit", async (evento) => {
      evento.preventDefault();
      const pregunta = input.value.trim();
      if (!pregunta) return;
      input.value = "";
      burbuja(pregunta, "user");
      enviar.disabled = true;
      escribiendo.style.display = "block";

      try {
        const r = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ mensaje: pregunta, sesion })
        });
        const datos = await r.json();
        if (!r.ok) {
          const nodo = burbuja(datos.error || "Ocurrió un error.", "bot error");
          nodo.classList.add("error");
        } else {
          const nodo = burbuja(datos.respuesta, "bot");
          conMeta(nodo, datos);
        }
      } catch (e) {
        burbuja("No pude conectar con el asistente. Revisa tu conexión e intenta de nuevo.", "bot error");
      } finally {
        enviar.disabled = false;
        escribiendo.style.display = "none";
        input.focus();
        actualizarUso();
      }
    });

    document.getElementById("nueva").addEventListener("click", () => {
      sesion = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()));
      localStorage.setItem(clave, sesion);
      hilo.innerHTML = "";
      burbuja("Hola, soy el asistente del programa. Pregúntame por fechas, requisitos, costos o trámites.", "bot");
    });

    for (const boton of document.querySelectorAll("#sugerencias button")) {
      boton.addEventListener("click", () => { input.value = boton.textContent; form.requestSubmit(); });
    }

    async function iniciar() {
      await cargarHistorial();
      if (!hilo.children.length) {
        burbuja("Hola, soy el asistente del programa. Pregúntame por fechas, requisitos, costos o trámites.", "bot");
      }
      actualizarUso();
    }
    iniciar();
  </script>
</body>
</html>
